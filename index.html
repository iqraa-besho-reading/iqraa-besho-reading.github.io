<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ابرام</title>
<style>
:root{--g:#0f766e;--g2:#14b8a6;--bg:#f1f5f4;--card:#fff;--ink:#12302d;--mut:#5b7370;--bad:#e11d48;--ok:#16a34a;--warn:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif}
body{min-height:100vh;padding-bottom:84px}
header{background:linear-gradient(135deg,var(--g),#115e59);color:#fff;padding:18px 16px 16px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;opacity:.9;font-size:14px}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0f766e14}
h2{margin:0 0 10px;font-size:18px}
h3{margin:12px 0 6px;font-size:15px;color:var(--mut)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:700;background:var(--g);color:#fff;font-family:inherit;cursor:pointer}
.btn.sec{background:#e2f1ef;color:var(--g)}
.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:15px;border-radius:12px}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #dbe7e5;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--mut);font-family:inherit}
nav button b{display:block;font-size:20px;margin-bottom:1px}
nav button.on{color:var(--g);font-weight:700}
.bar{height:12px;background:#dcebe9;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:8px}
.big{font-size:84px;line-height:1.5;text-align:center;font-family:"Noto Naskh Arabic","Traditional Arabic","Geeza Pro",Tahoma,serif;min-height:130px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;word-break:keep-all}
.big.long{font-size:46px;line-height:1.9}
.big.sent{font-size:34px;line-height:2.1}
.big .sy{display:inline-block;padding:0 3px}
.big.sep .sy{margin:0 7px;border-bottom:4px solid;border-radius:2px}
.c0{color:#0f766e;border-color:#0f766e}.c1{color:#c2410c;border-color:#c2410c}.c2{color:#6d28d9;border-color:#6d28d9}.c3{color:#be123c;border-color:#be123c}.c4{color:#0369a1;border-color:#0369a1}
.hint{text-align:center;color:var(--mut);font-size:14px;margin:4px 0 12px}
.lv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#f6faf9;margin-bottom:8px;border:2px solid transparent;cursor:pointer}
.lv.cur{border-color:var(--g2);background:#e9f8f5}
.lv .n{width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.lv .t{flex:1}.lv .t b{display:block}.lv .t small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lt{background:#f6faf9;border-radius:14px;text-align:center;font-size:38px;padding:8px 0 6px;font-family:"Noto Naskh Arabic",serif;border:2px solid transparent;cursor:pointer}
.lt small{display:block;font-size:12px;font-family:inherit;color:var(--mut)}
.lt.m{border-color:var(--ok)}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.forms div{background:#f6faf9;border-radius:12px;padding:6px 0;font-size:40px;font-family:"Noto Naskh Arabic",serif}
.forms small{display:block;font-size:12px;font-family:inherit;color:var(--mut)}
.pill{display:inline-block;background:#e2f1ef;color:var(--g);padding:3px 10px;border-radius:20px;font-size:13px;margin:2px}
.w{display:inline-block;font-size:28px;font-family:"Noto Naskh Arabic",serif;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:4px 12px;margin:4px;cursor:pointer}
.stat{display:flex;gap:8px;text-align:center}.stat div{flex:1;background:#f6faf9;border-radius:14px;padding:10px 4px}.stat b{display:block;font-size:24px;color:var(--g)}.stat small{color:var(--mut);font-size:12px}
.days{display:flex;gap:4px;align-items:flex-end;height:80px}.days div{flex:1;background:#cfe6e3;border-radius:5px 5px 0 0;min-height:4px;position:relative}
.days div.t{background:var(--g)}
.dl{display:flex;gap:4px;font-size:10px;color:var(--mut);text-align:center}.dl span{flex:1}
.opt{font-size:46px;padding:10px 0;font-family:"Noto Naskh Arabic",serif;background:#f6faf9;border:3px solid #e2efed;border-radius:16px;text-align:center;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#dcfce7}.opt.no{border-color:var(--bad);background:#ffe4e6}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top .bar{flex:1}
.x{border:0;background:#e2f1ef;border-radius:50%;width:36px;height:36px;font-size:18px}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px;font-size:14px;margin-bottom:12px}
.modal{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;border-radius:22px 22px 0 0;padding:18px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid #cfe0de;padding:8px;font-family:inherit;direction:ltr}
.ph{display:flex;gap:8px;overflow:auto;margin:8px 0}.ph img{width:96px;height:96px;object-fit:cover;border-radius:50%;border:3px solid var(--g2);flex:none}.hero{width:140px;height:140px;object-fit:cover;border-radius:50%;border:4px solid var(--g2);display:block;margin:0 auto 8px}
.praise{text-align:center;font-size:56px}
select,input[type=range]{width:100%;font-family:inherit;padding:8px}
</style>
</head>
<body>
<header><h1>📖 ابرام</h1><p id="sub"></p></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
"use strict";
/* ============ DATA ============ */
const FA="\u064E",DA="\u064F",KA="\u0650",SU="\u0652",SH="\u0651",TF="\u064B",TD="\u064C",TK="\u064D",ZWJ="\u200D";
// [letter, name, joinsToNext, sample word, group]
const LET=[
["ا","أَلِف",0,"أَسَد","ا"],["ب","بَاء",1,"بَطَّة","ب"],["ت","تَاء",1,"تُفَّاح","ب"],["ث","ثَاء",1,"ثَعْلَب","ب"],
["ج","جِيم",1,"جَمَل","ج"],["ح","حَاء",1,"حِصَان","ج"],["خ","خَاء",1,"خَرُوف","ج"],
["د","دَال",0,"دُبّ","د"],["ذ","ذَال",0,"ذُرَة","د"],["ر","رَاء",0,"رُمَّان","ر"],["ز","زَاي",0,"زَهْرَة","ر"],
["س","سِين",1,"سَمَكَة","س"],["ش","شِين",1,"شَمْس","س"],["ص","صَاد",1,"صَقْر","ص"],["ض","ضَاد",1,"ضِفْدَع","ص"],
["ط","طَاء",1,"طَائِر","ط"],["ظ","ظَاء",1,"ظَرْف","ط"],["ع","عَيْن",1,"عِنَب","ع"],["غ","غَيْن",1,"غُرَاب","ع"],
["ف","فَاء",1,"فِيل","ف"],["ق","قَاف",1,"قَمَر","ف"],["ك","كَاف",1,"كِتَاب","ك"],["ل","لَام",1,"لَيْمُون","ك"],
["م","مِيم",1,"مَوْز","م"],["ن","نُون",1,"نَجْمَة","ب"],["ه","هَاء",1,"هِلَال","هـ"],["و","وَاو",0,"وَرْدَة","و"],["ي","يَاء",1,"يَد","ب"]
];
const SIM=[["ب","ت","ث","ن","ي"],["ج","ح","خ"],["د","ذ"],["ر","ز"],["س","ش"],["ص","ض"],["ط","ظ"],["ع","غ"],["ف","ق"],["ك","ل"],["م","ه","و","ا"]];
const HAR=[[FA,"فَتْحَة"],[DA,"ضَمَّة"],[KA,"كَسْرَة"]];
const NON=["ا","د","ذ","ر","ز","و"]; // لا تتصل بما بعدها
const L1=LET.map(l=>({t:l[0],s:l[1],k:"L"+l[0],letter:l}));
const BASE=LET.filter(l=>l[0]!="ا");
const L2=[];HAR.forEach(h=>BASE.forEach(l=>L2.push({t:l[0]+h[0],s:l[0]+h[0],k:"S"+l[0]+h[0]})));
const L3=[];[[FA,"ا"],[DA,"و"],[KA,"ي"]].forEach(h=>BASE.forEach(l=>L3.push({t:l[0]+h[0]+h[1],s:l[0]+h[0]+h[1],k:"M"+l[0]+h[0]+h[1]})));
const SUK="بَلْ مِنْ عَنْ كَمْ هَلْ قَدْ لَمْ قُمْ نَمْ سِرْ بِعْ كُلْ خُذْ صَبْ ثَمْ جِدْ حَقْ رَدْ زُرْ طِرْ يَدْ فَمْ شَمْ دَمْ سَمْ تُبْ لَنْ مَنْ أَنْ".split(" ");
const L4=SUK.map(x=>({t:x,s:x,k:"K"+x}));
const TL="بتجدسكلمنهف قرزع".replace(" ","").split("");
const L5=[];TL.forEach(c=>[TF,TD,TK].forEach(h=>L5.push({t:c+h+(h==TF?"ا":""),s:c+h,k:"T"+c+h})));
const L6=[];TL.forEach(c=>HAR.forEach(h=>L6.push({t:c+SH+h[0],s:c+SH+h[0],k:"H"+c+h[0]})));
function W(str){return str.trim().split(/\s+/).map(x=>{const p=x.split("|");return {t:p.join(""),s:p.join(""),p:p,k:"W"+p.join("")}})}
const L7=W("قَ|مَرْ شَ|جَرْ وَ|لَدْ بَ|لَدْ سَ|مَكْ نَ|هَرْ حَ|جَرْ جَ|بَلْ بَ|قَرْ ذَ|هَبْ عَ|سَلْ كَ|تَ|بَ فَ|تَ|حَ ذَ|هَ|بَ جَ|لَ|سَ دَ|رَ|سَ لَ|عِ|بَ شَ|رِ|بَ كَ|ثُ|رَ نَ|ظَ|رَ");
const L8=W("بَابْ نُو|رْ فِيلْ بَا|بَا مَا|مَا كِ|تَابْ حِ|مَارْ طَ|رِيقْ جَ|مِيلْ كَ|بِيرْ صَ|غِيرْ كَ|رِيمْ طَ|وِيلْ قَ|مِيصْ دَ|جَاجْ سَ|مَاعْ بُو|قْ عَ|صَا نَا|رْ دِي|كْ سَ|لَا|مْ");
const L9=W("بِنْ|تْ شَمْ|سْ زَهْ|رَةْ حَقْ|لْ كَلْ|بْ قَلْ|بْ نَجْ|مْ يَوْ|مْ مَكْ|تَبْ مَسْ|جِدْ بُسْ|تَانْ مَدْ|رَ|سَةْ حَدِي|قَةْ مِلْ|حْ كُرْ|سِيْ جَنْ|بِيْ بَيْ|تْ لَيْ|لْ سُنْ|بُلْ مِفْ|تَاحْ مِسْ|مَارْ");
const L10=W("كِ|تَا|بً|ا وَ|لَ|دٌ بَيْ|تٍ طَا|لِ|بٌ كَ|بِي|رٌ جَ|مِي|لٌ مَدْ|رَ|سَ|ةً شَ|جَ|رَ|ةٌ رَ|جُ|لٌ فِي بَيْ|تٍ دُبّ جَدّ حَقّ أُمّ سُلّمْ قِطّ|ةْ جَنّ|ةْ مُ|عَلّ|مْ مُ|دَرّ|سْ كُرّا|سَةْ سَرِيرْ");
const L11=W("الشَّمْ|سُ الْقَ|مَ|رُ الْبَا|بُ الْوَ|لَ|دُ الْكِ|تَا|بُ الْجَ|مَ|لُ النَّ|هْ|رُ الْمَدْ|رَ|سَةُ الْحَدِي|قَةُ الْفَصْ|لُ الْمُ|عَلّ|مُ");
const SENT=[
"هَذَا بَيْتٌ كَبِيرٌ.","فَتَحَ أَحْمَدُ الْبَابَ.","ذَهَبَ الْوَلَدُ إِلَى الْمَدْرَسَةِ.","يَقْرَأُ بِيشُوي الْكِتَابَ.",
"الشَّمْسُ جَمِيلَةٌ فِي الصَّبَاحِ.","أُحِبُّ أُمِّي وَأَبِي.","جَلَسَ الطَّالِبُ فِي الْفَصْلِ.","فِي الْحَدِيقَةِ شَجَرَةٌ كَبِيرَةٌ.",
"سَمِعَ الْوَلَدُ صَوْتَ الْجَرَسِ.","يَلْعَبُ الْأَطْفَالُ فِي الْمَلْعَبِ.","كَتَبَ الطَّالِبُ الدَّرْسَ.","اللَّهُ يُحِبُّ الْجَمِيعَ."
].map(s=>({t:s,s:s,p:s.replace(/\.$/,"").split(" "),k:"X"+s,sent:1}));
const LEVELS=[
{id:1,title:"الحروف وأشكالها",desc:"٢٨ حرف: اسمه وشكله أول/وسط/آخر الكلمة",items:L1,letters:1},
{id:2,title:"الفتحة والضمة والكسرة",desc:"بَ بُ بِ: الحرف مع الحركة",items:L2},
{id:3,title:"المدود",desc:"بَا بُو بِي: الألف والواو والياء",items:L3},
{id:4,title:"السكون",desc:"بَلْ مِنْ قُمْ: حرف ساكن في الآخر",items:L4},
{id:5,title:"التنوين",desc:"بً بٌ بٍ",items:L5},
{id:6,title:"الشدة",desc:"بَّ بُّ بِّ: حرف مكرر",items:L6},
{id:7,title:"كلمات سهلة",desc:"كلمات قصيرة مقطّعة",items:L7},
{id:8,title:"كلمات فيها مد",desc:"كِتَاب، طَرِيق، جَمِيل",items:L8},
{id:9,title:"كلمات فيها سكون",desc:"شَمْس، مَدْرَسَة، بُسْتَان",items:L9},
{id:10,title:"تنوين وشدة",desc:"وَلَدٌ، مُعَلِّم، قِطَّة",items:L10},
{id:11,title:"ال التعريف",desc:"الشَّمْسُ، الْقَمَرُ",items:L11},
{id:12,title:"جمل قصيرة",desc:"اقرأ جملة كلمة كلمة",items:SENT}
];
const PRAISE=["برافو! 👏","ممتاز! 🌟","شاطر! 💪","كمّل كده! 🔥","تمام جدًا! ✅"];
/* ============ STATE ============ */
const KEY="qr_arabic_v1";
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 S=Object.assign({photos:[],name:"",stats:{},days:{},stumble:{},rate:0.7,level:1},S||{})}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
load();
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const st=k=>S.stats[k]||(S.stats[k]={ok:0,bad:0,last:0});
const mastered=it=>{const x=S.stats[it.k];return x&&x.ok>=2&&x.last==1};
const lvPct=lv=>Math.round(100*lv.items.filter(mastered).length/lv.items.length);
function curLevel(){for(const lv of LEVELS){if(lvPct(lv)<80)return lv}return LEVELS[LEVELS.length-1]}
function streak(){let n=0;const d=new Date();if(!S.days[today()])d.setDate(d.getDate()-1);
 for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(S.days[k]){n++;d.setDate(d.getDate()-1)}else break}return n}
/* ============ AUDIO ============ */
let voice=null,voices=[];
function pickVoice(){voices=(window.speechSynthesis?speechSynthesis.getVoices():[]);
 const ar=voices.filter(v=>/^ar/i.test(v.lang));
 voice=ar.find(v=>/ar[-_]EG/i.test(v.lang))||ar.find(v=>/ar[-_]SA/i.test(v.lang))||ar[0]||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=()=>{pickVoice();if(typeof render=="function"&&view=="home")render()}}
function say(text,slow){if(!window.speechSynthesis)return false;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang:"ar-SA";if(voice)u.voice=voice;
 u.rate=slow?Math.max(.35,S.rate-.25):S.rate;speechSynthesis.speak(u);return true}catch(e){return false}}
const audioOK=()=>!!window.speechSynthesis&&!!voice;
/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function forms(l){const c=l[0],nj=!l[2];return[["منفصل",c],["أول الكلمة",nj?null:c+ZWJ],["وسط الكلمة",nj?null:ZWJ+c+ZWJ],["آخر الكلمة",ZWJ+c]]}
function bigHTML(it,sep){
 if(it.p){const cls=it.sent?"big sent":(it.t.length>7?"big long":"big");
  return `<div class="${cls}${sep?" sep":""}" id="big">`+it.p.map((x,i)=>`<span class="sy c${i%5}" data-i="${i}">${esc(x)}</span>`+(it.sent&&!sep?" ":"")).join("")+`</div>`}
 return `<div class="big" id="big">${esc(it.t)}</div>`}
function addPhotos(inp){[...inp.files].slice(0,12).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),m=360,k=Math.min(1,m/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photos.push(c.toDataURL('image/jpeg',.7));try{save()}catch(e){S.photos.pop();alert('المساحة ممتلئة')}render()};im.src=r.result};r.readAsDataURL(f)});inp.value=''}
const rndPhoto=()=>S.photos.length?S.photos[Math.random()*S.photos.length|0]:"";
/* ============ VIEWS ============ */
let view="home",sess=null;
const TABS=[["home","🏠","الرئيسية"],["levels","🪜","الدروس"],["letters","🔤","الحروف"],["games","🎮","ألعاب"],["extra","🌟","إنجليزي وحساب"],["parent","👨‍👩‍👦","ولي الأمر"]];
function render(){
 $("#sub").textContent=S.name?`أهلاً يا ${S.name} 👋`:"تدرّب كل يوم ١٠ دقايق، وهتتحسن";
 $("#nav").innerHTML=TABS.map(t=>`<button class="${view==t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");
 $("#nav").style.display=(sess||(typeof G!="undefined"&&G))?"none":"flex";
 ({home:vHome,levels:vLevels,letters:vLetters,words:vWords,games:vGames,parent:vParent,practice:vPractice,done:vDone,extra:vExtra,words:vWords})[view]();
 window.scrollTo(0,0)}
function go(v){if(typeof G!="undefined"&&G){clearInterval(G.tm);clearInterval(G.sp);clearTimeout(G.to);G=null}view=v;sess=null;render()}
function audioBanner(){return audioOK()?"":`<div class="banner">🔇 الصوت العربي مش متاح على الموبايل ده. التطبيق شغّال بدونه، لكن للسماع روح إعدادات الموبايل &gt; إمكانية الوصول &gt; تحويل النص إلى كلام، ونزّل صوت اللغة العربية. بعدها افتح التطبيق تاني.</div>`}
function vHome(){

 if(kind=="hear")qs=shuffle(AL).slice(0,10).map(a=>({sp:a[0],pr:`<div class="big" style="min-height:90px;font-size:60px">🔊</div><p class="hint">اسمع الحرف واختاره</p>`,o:pickN(AL.map(x=>x[0]),a[0],4),a:a[0],ls:1}));

 else qs=shuffle(EW).slice(0,10).map(w=>({sp:w[0],pr:`<div class="big" style="min-height:90px">${w[1]}</div><p class="hint">${w[2]} - اسمها إيه بالإنجليزي؟</p>`,o:pickN(EW.map(x=>x[0]),w[0],4),a:w[0]}));
 X={qs,i:0,ok:0,key};enQ()}
function enQ(){const q=X.qs[X.i];
 xScreen(`${X.i+1}/${X.qs.length}`,`<div class="card">${q.pr}<button class="btn sec small" style="margin:0 auto 10px;display:block" onclick="sayEn(X.qs[X.i].sp)">🔊 اسمع</button><div class="grid" style="grid-template-columns:repeat(${q.cols||2},1fr)" dir="ltr">`+q.o.map((o,j)=>`<div class="opt" dir="${q.rtl?"rtl":"ltr"}" style="font-size:${q.fs||(q.ls?54:30)}px;font-family:system-ui,Arial,sans-serif;font-weight:700" onclick="enAns(this,${j})">${esc(o)}</div>`).join("")+`</div></div>`);
 setTimeout(()=>sayEn(q.sp),300)}
function enAns(el,j){if(X.lock)return;X.lock=1;const q=X.qs[X.i];const good=q.o[j]==q.a;if(good){X.ok++;el.classList.add("ok")}else{el.classList.add("no");[...document.querySelectorAll(".opt")].forEach(e=>{if(e.textContent==q.a)e.classList.add("ok")})}
 X.to=setTimeout(()=>{X.lock=0;X.i++;X.i<X.qs.length?enQ():xEnd(X.ok,X.qs.length,X.key,X.again||"enQuiz('"+X.key.slice(2)+"')")},good?700:1500)}
function xEnd(ok,n,key,again){addPts(ok*2);const nb=best(key,ok);const k=X;xScreen("النتيجة",`<div class="card" style="text-align:center"><div class="praise">${nb?"🏆":ok>=n*.8?"🌟":"👏"}</div><h2>${ok} من ${n}</h2><p class="hint">+${ok*2} ⭐ نقاط${nb?" - رقم قياسي!":""}</p><button class="btn" onclick="${again}">العب تاني</button><button class="btn sec" style="margin-top:8px" onclick="go('extra')">رجوع</button></div>`)}
function enSpell(){X={qs:shuffle(EW.filter(w=>w[0].length<=5)).slice(0,8),i:0,ok:0,key:"e_spell"};spRound()}
function spRound(){const w=X.qs[X.i];X.pos=0;X.bad=0;X.letters=shuffle(w[0].split("").map((c,i)=>[c,i]));
 xScreen(`${X.i+1}/${X.qs.length}`,`<div class="card" style="text-align:center"><div class="big" style="min-height:90px">${w[1]}</div><p class="hint">${w[2]}</p><button class="btn sec small" style="margin:0 auto 8px;display:block" onclick="sayEn('${w[0]}')">🔊 اسمع</button><div id="slots" dir="ltr" style="font-size:46px;font-weight:800;letter-spacing:8px;min-height:70px;font-family:system-ui,Arial,sans-serif">${w[0].split("").map(()=>"_").join(" ")}</div><div class="grid" dir="ltr" style="margin-top:10px">`+X.letters.map((l,j)=>`<div class="opt" id="sl${j}" style="font-size:38px;font-family:system-ui,Arial,sans-serif;font-weight:800" onclick="spTap(${j})">${l[0]}</div>`).join("")+`</div></div>`);sayEn(w[0])}
function spTap(j){const w=X.qs[X.i];const l=X.letters[j];const el=$("#sl"+j);if(el.style.visibility=="hidden")return;
 if(l[0]==w[0][X.pos]){X.pos++;el.style.visibility="hidden";$("#slots").textContent=w[0].slice(0,X.pos).split("").join(" ")+" "+w[0].slice(X.pos).split("").map(()=>"_").join(" ");
  if(X.pos==w[0].length){if(!X.bad)X.ok++;sayEn(w[0]);X.to=setTimeout(()=>{X.i++;X.i<X.qs.length?spRound():xEnd(X.ok,X.qs.length,"e_spell","enSpell()")},900)}}
 else{X.bad++;el.classList.add("no");setTimeout(()=>el.classList.remove("no"),400)}}
function enMemory(){const ws=shuffle(EW).slice(0,6);const cards=shuffle(ws.map(w=>({k:w[0],t:w[1],pic:1})).concat(ws.map(w=>({k:w[0],t:w[0]}))));X={cards,open:[],done:0,moves:0,key:"e_mem"};
 xScreen("لعبة الذاكرة",`<div class="card"><p class="hint">وصّل الصورة بكلمتها <span id="mv"></span></p><div class="grid" dir="ltr" style="grid-template-columns:repeat(3,1fr)">`+cards.map((c,i)=>`<div class="opt" id="mc${i}" style="font-size:${c.pic?44:22}px;min-height:84px;display:flex;align-items:center;justify-content:center;font-family:system-ui,Arial,sans-serif;font-weight:700" onclick="mcTap(${i})">❓</div>`).join("")+`</div></div>`)}
function mcTap(i){if(X.lock)return;const c=X.cards[i],el=$("#mc"+i);if(X.open.includes(i)||el.dataset.d)return;el.textContent=c.t;el.style.background="#e9f8f5";if(!c.pic)sayEn(c.t);X.open.push(i);
 if(X.open.length==2){X.moves++;$("#mv").textContent="("+X.moves+" محاولة)";const[a,b]=X.open;
  if(X.cards[a].k==X.cards[b].k){[a,b].forEach(j=>{$("#mc"+j).dataset.d=1;$("#mc"+j).classList.add("ok")});X.open=[];X.done++;if(X.done==6)X.to=setTimeout(()=>{const sc=Math.max(0,12-Math.max(0,X.moves-6));xEnd(sc>10?10:sc,10,"e_mem","enMemory()")},700)}
  else{X.lock=1;X.to=setTimeout(()=>{[a,b].forEach(j=>{const e=$("#mc"+j);e.textContent="❓";e.style.background=""});X.open=[];X.lock=0},900)}}}
/* ---- Mental math ---- */
const MCFG=[null,{n:3,lo:1,hi:9,max:9,t:"سهل: أرقام من 1 لـ 9"},{n:4,lo:1,hi:9,max:20,t:"أرقام من 1 لـ 9، النتيجة لحد 20"},{n:3,lo:1,hi:99,max:99,t:"أرقام لحد 99"},{n:4,lo:1,hi:99,max:199,t:"4 أرقام لحد 99"},{n:5,lo:10,hi:99,max:299,t:"5 أرقام من خانتين"}];
function genSeq(l){const c=MCFG[l];let tot=0;const seq=[];
 for(let k=0;k<c.n;k++){let v=1,s=1,ok=false;for(let t=0;t<60&&!ok;t++){v=c.lo+(Math.random()*(c.hi-c.lo+1)|0);s=(k==0||Math.random()<.5)?1:-1;const nt=tot+s*v;ok=nt>=0&&nt<=c.max&&(k>0||s>0)}
  if(!ok){s=tot+1<=c.max?1:-1;v=1}tot+=s*v;seq.push(s*v)}
 return{seq,ans:tot}}
function mathMenu(mode){X={};const sp=[2000,1500,1000,700];
 xScreen(mode=="flash"?"فلاش":"جمع وطرح",`<div class="card">`+(mode=="flash"?`<h3>سرعة ظهور الرقم</h3><div class="row" id="spd">`+sp.map(s=>`<button class="btn small ${s==mSpeed?"":"sec"}" onclick="mSpeed=${s};mathMenu('flash')">${s/1000} ث</button>`).join("")+`</div>`:"")+`<h3>اختار المستوى</h3>`+[1,2,3,4,5].map(l=>`<div class="lv" onclick="startMath('${mode}',${l})"><div class="n">${l}</div><div class="t"><b>مستوى ${l}</b><small>${MCFG[l].t}</small></div></div>`).join("")+`</div>`)}
function startMath(mode,lvl){const qs=[];for(let i=0;i<10;i++){const g=genSeq(lvl);qs.push({seq:g.seq,a:g.ans})}X={qs,i:0,ok:0,mode,lvl,key:"m_"+mode,again:`startMath('${mode}',${lvl})`,typ:""};mQ()}
const fmtSeq=seq=>seq.map((v,i)=>i==0?String(v):(v<0?"− ":"+ ")+Math.abs(v));
function keypad(){return `<div class="grid" dir="ltr" style="grid-template-columns:repeat(3,1fr);margin-top:10px">`+[1,2,3,4,5,6,7,8,9,"⌫",0,"✓"].map(k=>`<div class="opt" style="font-size:30px;padding:12px 0;${k=="✓"?"background:#dcfce7":""}" onclick="kp('${k}')">${k}</div>`).join("")+`</div>`}
function mQ(){const q=X.qs[X.i];X.typ="";X.lock=0;
 const head=`<div class="bar" style="margin-bottom:10px"><i style="width:${X.i/X.qs.length*100}%"></i></div>`;
 const ans=`<div id="ans" dir="ltr" style="text-align:center;font-size:44px;font-weight:800;min-height:62px;border-bottom:3px solid var(--g2);margin:8px 30px;font-family:system-ui,Arial,sans-serif">&nbsp;</div>`+keypad();
 if(X.mode=="flash"){xScreen(`${X.i+1}/${X.qs.length}`,head+`<div class="card" id="fl" style="text-align:center"><div id="fn" dir="ltr" style="font-size:96px;font-weight:800;min-height:130px;line-height:130px;font-family:system-ui,Arial,sans-serif">🧠</div><p class="hint" id="fh">استعد... الأرقام هتظهر وتختفي</p><div id="ansbox" style="display:none">${ans}</div></div>`);
  let k=-1;const step=()=>{if(!X||X.qs!==X.qs)return;k++;const fn=$("#fn");if(!fn)return;if(k>=q.seq.length){fn.textContent="؟";$("#fh").textContent="الناتج كام؟";$("#ansbox").style.display="block";return}
   fn.textContent=fmtSeq(q.seq)[k];X.to=setTimeout(()=>{const f=$("#fn");if(f)f.textContent="";X.to=setTimeout(step,250)},mSpeed)};
  X.to=setTimeout(step,1200)}
 else xScreen(`${X.i+1}/${X.qs.length}`,head+`<div class="card" style="text-align:center"><div dir="ltr" style="display:inline-block;text-align:right;font-size:54px;font-weight:800;line-height:1.35;font-family:system-ui,Arial,sans-serif">${fmtSeq(q.seq).map(s=>`<div>${s}</div>`).join("")}<div style="border-top:4px solid var(--ink);margin-top:4px"></div></div>${ans}</div>`)}
function kp(k){if(!X||X.lock)return;const sh=()=>{const e=$("#ans");if(e)e.textContent=X.typ||"\u00a0"};
 if(k=="⌫"){X.typ=X.typ.slice(0,-1);sh()}else if(k=="✓"){if(X.typ==="")return;mCheck()}else if(X.typ.length<4){X.typ+=k;sh()}}
function mCheck(){X.lock=1;const q=X.qs[X.i];const good=+X.typ===q.a;const e=$("#ans");
 if(good){X.ok++;e.style.color="var(--ok)";e.textContent="✓ "+q.a}else{e.style.color="var(--bad)";e.innerHTML=`${X.typ} ✗ <small style="font-size:20px">الصح: ${q.a}</small>`;if(X.mode=="flash"){const fh=$("#fh");if(fh)fh.textContent=fmtSeq(q.seq).join("  ")}}
 X.to=setTimeout(()=>{X.i++;X.i<X.qs.length?(X.mul?mulQ():mQ()):mEnd()},good?700:2200)}
function mEnd(){const ok=X.ok,n=X.qs.length,key=X.key,again=X.again,lvl=X.lvl;addPts(ok*3);const nb=best(key,ok);
 xScreen("النتيجة",`<div class="card" style="text-align:center"><div class="praise">${ok>=9?"🏆":ok>=7?"🌟":"👏"}</div><h2>${ok} من ${n}</h2><p class="hint">+${ok*3} ⭐${nb?" - رقم قياسي!":""}</p>${lvl&&ok>=8&&lvl<5?`<p class="hint" style="color:var(--ok)">شاطر! جرّب المستوى الجاي</p>`:""}<button class="btn" onclick="${again}">تاني</button>${lvl&&ok>=8&&lvl<5?`<button class="btn ok" style="margin-top:8px" onclick="${again.replace(/,\d\)/,","+(lvl+1)+")")}">المستوى الجاي ▶</button>`:""}<button class="btn sec" style="margin-top:8px" onclick="go('extra')">رجوع</button></div>`)}
function mulMenu(){X={};xScreen("جدول الضرب",`<div class="card"><h3>اختار الجدول</h3><div class="grid" dir="ltr">`+[2,3,4,5,6,7,8,9,10].map(t=>`<div class="lt" style="font-family:system-ui;font-weight:800" onclick="startMul(${t})">×${t}</div>`).join("")+`<div class="lt" style="font-family:system-ui;font-weight:800;grid-column:span 3;font-size:22px;padding:18px 0" onclick="startMul(0)">كله 🎲</div></div></div>`)}
function startMul(t){const qs=[];for(let i=0;i<10;i++){const a=t||(2+Math.random()*9|0),b=1+(Math.random()*10|0);qs.push({a:a*b,txt:`${a} × ${b}`})}X={qs,i:0,ok:0,mul:1,key:"m_mul",again:`startMul(${t})`,typ:""};mulQ()}
function mulQ(){const q=X.qs[X.i];X.typ="";X.lock=0;xScreen(`${X.i+1}/${X.qs.length}`,`<div class="bar" style="margin-bottom:10px"><i style="width:${X.i/X.qs.length*100}%"></i></div><div class="card" style="text-align:center"><div dir="ltr" style="font-size:64px;font-weight:800;font-family:system-ui,Arial,sans-serif">${q.txt} = ?</div><div id="ans" dir="ltr" style="text-align:center;font-size:44px;font-weight:800;min-height:62px;border-bottom:3px solid var(--g2);margin:8px 30px;font-family:system-ui,Arial,sans-serif">&nbsp;</div>${keypad()}</div>`)}
/* ---- soroban ---- */
var AB=null;
function abacus(){AB={r:[{h:0,e:0},{h:0,e:0},{h:0,e:0},{h:0,e:0}],t:0,free:1};abDraw()}
function abVal(){return AB.r.reduce((s,x,i)=>s+(x.h*5+x.e)*Math.pow(10,3-i),0)}
function abDraw(){let svg=`<svg viewBox="0 0 330 250" width="100%" style="max-width:420px;direction:ltr"><rect x="6" y="6" width="318" height="238" rx="14" fill="#8b5a2b"/><rect x="14" y="14" width="302" height="222" rx="8" fill="#f5deb3"/><rect x="14" y="96" width="302" height="7" fill="#5b3a1a"/>`;
 AB.r.forEach((r,i)=>{const x=50+i*76;svg+=`<rect x="${x-2}" y="20" width="4" height="210" fill="#5b3a1a"/>`;
  svg+=`<ellipse cx="${x}" cy="${r.h?73:36}" rx="24" ry="12" fill="#c2410c" onclick="abTap(${i},0)"/>`;
  for(let k=1;k<=4;k++){const y=(k<=r.e?112:150)+(k-1)*24;svg+=`<ellipse cx="${x}" cy="${y}" rx="24" ry="12" fill="#0f766e" onclick="abTap(${i},${k})"/>`}
  svg+=`<text x="${x}" y="248" font-size="11" text-anchor="middle" fill="#5b3a1a">${["آلاف","مئات","عشرات","آحاد"][i]}</text>`});
 svg+=`</svg>`;
 xScreen("السوروبان",`<div class="card" style="text-align:center">${AB.free?`<p class="hint">جرّب بنفسك: الخرزة الحمرا فوق = 5، والخضرا تحت = 1 لكل واحدة. اضغط على الخرزة تحركها ناحية الفاصل.</p>`:`<h2 dir="ltr">حط الرقم: <span style="color:var(--g)">${AB.t}</span></h2>`}${svg}<div dir="ltr" style="font-size:44px;font-weight:800;font-family:system-ui">${abVal()}</div><div class="row" style="margin-top:10px">${AB.free?`<button class="btn" onclick="abNew()">🎯 تحدي</button>`:`<button class="btn ok" onclick="abCheck()">✓ تأكد</button><button class="btn sec" onclick="abNew()">رقم تاني</button>`}<button class="btn sec" onclick="AB.r.forEach(x=>{x.h=0;x.e=0});abDraw()">صفّر</button></div></div>`)}
function abTap(i,k){const r=AB.r[i];if(k==0)r.h=r.h?0:1;else r.e=r.e>=k?k-1:k;abDraw()}
function abNew(){AB.free=0;AB.t=1+(Math.random()*(AB.sc>3?9998:99)|0);AB.r.forEach(x=>{x.h=0;x.e=0});abDraw()}
function abCheck(){if(abVal()==AB.t){AB.sc=(AB.sc||0)+1;addPts(3);best("m_aba",AB.sc);const m=document.createElement("div");m.className="modal";m.innerHTML=`<div style="text-align:center"><div class="praise">🌟</div><h2>صح! +3 ⭐</h2><button class="btn" onclick="this.closest('.modal').remove();abNew()">رقم جديد</button></div>`;document.body.appendChild(m)}
 else{alert("لسه مش مظبوط، حاول تاني")}}

/* ---- grades 1-6 ---- */
function enGrade(g){const G6=GR[g];
 xScreen("الصف "+(g+1),`<div class="card"><h2>${G6[0]} ${G6[1]}: ${G6[2]}</h2><p class="hint">اضغط على الجملة تسمعها</p>`+G6[3].map((it,i)=>{const[a,b]=it.split("|");return `<div class="lv" onclick="sayG(${g},${i})"><div class="t"><b dir="ltr" style="font-size:20px;text-align:left">${esc(a)}</b><small>${esc(b)}</small></div><div style="font-size:22px">🔊</div></div>`}).join("")+`</div><div class="card"><h2>🎮 تمارين الصف ${g+1}</h2>
 <div class="lv" onclick="enGQ(${g},'mean')"><div class="n" style="background:none;font-size:28px">🔤</div><div class="t"><b>إيه معناها؟</b><small>اختار المعنى بالعربي</small></div><div style="font-size:13px;color:var(--mut)">${(S.best||{})["e_g"+g+"mean"]?"أحسن: "+S.best["e_g"+g+"mean"]:""}</div></div>
 <div class="lv" onclick="enGQ(${g},'hear')"><div class="n" style="background:none;font-size:28px">👂</div><div class="t"><b>اسمع واختار</b><small>اسمع الجملة واختار المكتوبة صح</small></div></div>
 <div class="lv" onclick="enGQ(${g},'blank')"><div class="n" style="background:none;font-size:28px">✍️</div><div class="t"><b>كمّل الجملة</b><small>اختار الكلمة الناقصة</small></div></div></div>`)}
function sayG(g,i){sayEn(GR[g][3][i].split("|")[0])}
function enGQ(g,kind){const G6=GR[g],its=G6[3].map(x=>x.split("|")),key="e_g"+g+kind;let qs;
 const allAr=[].concat(...GR.map(x=>x[3].map(y=>y.split("|")[1])));
 if(kind=="mean")qs=shuffle(its).slice(0,10).map(it=>({sp:it[0],pr:bigEn(it[0],it[0].length>14?26:40),o:pickN(its.map(x=>x[1]).concat(shuffle(allAr).slice(0,6)),it[1],4),a:it[1],rtl:1,fs:18,cols:1}));
 else if(kind=="hear")qs=shuffle(its).slice(0,10).map(it=>({sp:it[0],pr:`<div class="big" style="min-height:90px;font-size:60px">🔊</div><p class="hint">اسمع واختار المكتوب صح</p>`,o:pickN(its.map(x=>x[0]),it[0],4),a:it[0],fs:20,cols:1}));
 else qs=shuffle(G6[4]).concat(shuffle(G6[4])).slice(0,8).map(b=>({sp:b[0].replace("___",b[1]),pr:bigEn(b[0],b[0].length>16?26:34)+`<p class="hint">${b[3]}</p>`,o:pickN([b[1]].concat(b[2]),b[1],3),a:b[1],fs:32,cols:3}));
 X={qs,i:0,ok:0,key,again:`enGQ(${g},'${kind}')`};enQ()}

render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
